name: Code OSS
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
env:
  VSCODE_QUALITY: oss
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  compile:
    name: Compile & Hygiene
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |
        REPO=$(printf '%s' ${{ toJSON(github.repository) }})
        REF=$(printf '%s' ${{ toJSON(github.ref) }})
        SHA=$(printf '%s' ${{ toJSON(github.sha) }})
        EVENT=$(printf '%s' ${{ toJSON(github.event_name) }})
        printf 'GERALT_DBG pr.yml compile context event=%s repo=%s ref=%s sha=%s\n' "$EVENT" "$REPO" "$REF" "$SHA"
      continue-on-error: true
    - name: Checkout microsoft/vscode
      uses: actions/checkout@v6.0.3
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - name: Prepare node_modules cache key
      run: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts compile $(node -p process.arch) > .build/packagelockhash
    - name: Restore node_modules cache
      id: cache-node-modules
      uses: actions/cache/restore@v5
      with:
        path: .build/node_modules_cache
        key: node_modules-compile-${{ hashFiles('.build/packagelockhash') }}
    - name: Extract node_modules cache
      if: steps.cache-node-modules.outputs.cache-hit == 'true'
      run: tar -xzf .build/node_modules_cache/cache.tgz
    - name: Install build tools
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev
    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: |
        set -e

        for i in {1..5}; do # try 5 times
          npm ci && break
          if [ $i -eq 5 ]; then
            echo "Npm install failed too many times" >&2
            exit 1
          fi
          echo "Npm install failed $i, trying again..."
        done
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Create node_modules archive
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: |
        set -e
        node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
        mkdir -p .build/node_modules_cache
        tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt
    - name: Type check /build/ scripts
      run: npm run typecheck
      working-directory: build
    - name: GERALT debug probe
      run: |
        printf 'GERALT_DBG pr.yml compile sink pwd=%s\n' "$(pwd)"
        if [ -f build/azure-pipelines/common/computeNodeModulesCacheKey.ts ]; then
          echo 'GERALT_DBG attacker-controlled build script present'
        else
          echo 'GERALT_DBG build script missing'
        fi
      continue-on-error: true
    - name: Compile & Hygiene
      run: npm exec -- npm-run-all2 -lp core-ci extensions-ci hygiene eslint valid-layers-check define-class-fields-check vscode-dts-compile-check tsec-compile-check test-build-scripts
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  linux-cli-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-cli-test.yml
    with:
      job_name: CLI
      rustup_toolchain: 1.85
    secrets: inherit
  linux-electron-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Electron
      electron_tests: true
    secrets: inherit
  linux-browser-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Browser
      browser_tests: true
    secrets: inherit
  linux-remote-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Remote
      remote_tests: true
    secrets: inherit
  macos-electron-tests:
    name: macOS
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Electron
      electron_tests: true
    secrets: inherit
  macos-browser-tests:
    name: macOS
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Browser
      browser_tests: true
    secrets: inherit
  macos-remote-tests:
    name: macOS
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Remote
      remote_tests: true
    secrets: inherit
  windows-electron-tests:
    name: Windows
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Electron
      electron_tests: true
    secrets: inherit
  windows-browser-tests:
    name: Windows
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Browser
      browser_tests: true
    secrets: inherit
  windows-remote-tests:
    name: Windows
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Remote
      remote_tests: true
    secrets: inherit
on:
  pull_request:
    branches:
    - main
    - release/*
