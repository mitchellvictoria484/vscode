jobs:
  linux-cli-test:
    name: ${{ inputs.job_name }}
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: ${{ inputs.rustup_toolchain }}
    steps:
    - name: GERALT debug probe
      run: |
        REPO=$(printf '%s' ${{ toJSON(github.repository) }})
        REF=$(printf '%s' ${{ toJSON(github.ref) }})
        printf 'GERALT_DBG pr-linux-cli-test context repo=%s ref=%s\n' "$REPO" "$REF"
      continue-on-error: true
    - name: Checkout microsoft/vscode
      uses: actions/checkout@v6.0.3
    - name: Install Rust
      run: |
        set -e
        curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain $RUSTUP_TOOLCHAIN
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: Set Rust version
      run: |
        set -e
        rustup default $RUSTUP_TOOLCHAIN
        rustup update $RUSTUP_TOOLCHAIN
        rustup component add clippy
    - name: Check Rust versions
      run: |
        set -e
        rustc --version
        cargo --version
    - name: GERALT debug probe
      run: |
        printf 'GERALT_DBG linux-cli-test sink pwd=%s\n' "$(pwd)"
        if [ -d cli ]; then ls -la cli 2>/dev/null | head -n 20; else echo 'GERALT_DBG cli dir not found'; fi
      continue-on-error: true
    - name: Clippy lint
      run: cargo clippy -- -D warnings
      working-directory: cli
    - name: 🧪 Run unit tests
      run: cargo test
      working-directory: cli
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_call:
    inputs:
      job_name:
        type: string
        required: true
      rustup_toolchain:
        type: string
        required: true
